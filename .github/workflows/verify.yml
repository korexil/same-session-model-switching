name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test controller semantics
        run: python -m unittest discover -s reference -p "test_*.py"
      - name: Run same-session demonstration
        run: python reference/demo.py
      - name: Test privacy detector
        run: python scripts/privacy_check.py --self-test
      - name: Scan public tree and local links
        run: python scripts/privacy_check.py
